<!-- Shared navigation bar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">

        <!-- Website name -->
        <a class="navbar-brand" href="/">Content Culture</a>

        <!-- Navigation links and account buttons -->
        <div class="d-flex align-items-center gap-3">

            <!-- Navigation links -->
            <a class="nav-link {% if request.path == '/' %}active{% endif %}" href="/">
                Home
            </a>

            <a class="nav-link {% if request.path.startswith('/lists') %}active{% endif %}" href="/lists">
                My Lists
            </a>

            <!-- Account buttons only on homepage -->
            {% if request.path == "/" %}

            <button type="button" class="btn btn-outline-light btn-sm" data-bs-toggle="modal"
                data-bs-target="#loginModal">
                Log In
            </button>

            <button type="button" class="btn btn-primary btn-sm" data-bs-toggle="modal" data-bs-target="#registerModal">
                Register
            </button>

            {% endif %}

        </div>
    </div>
</nav>

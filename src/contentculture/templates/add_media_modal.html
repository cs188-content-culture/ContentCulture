<!-- Add Media popup -->
<div class="modal fade" id="addMediaModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">

            <div class="modal-header">
                <h5 class="modal-title">Add Media</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>

            <div class="modal-body">
                <form id="addMediaForm">

                    <div class="mb-3">
                        <label for="mediaTitle" class="form-label">Title</label>
                        <input type="text" class="form-control" id="mediaTitle" required>
                    </div>

                    <div class="mb-3">
                        <label for="mediaMedium" class="form-label">Medium</label>
                        <select class="form-select" id="mediaMedium">
                            <option value="Movie">Movie</option>
                            <option value="TV Show">TV Show</option>
                            <option value="Book">Book</option>
                            <option value="Game">Game</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label for="mediaRating" class="form-label">Rating</label>
                        <select class="form-select" id="mediaRating">
                            <option value="5">5/5</option>
                            <option value="4">4/5</option>
                            <option value="3">3/5</option>
                            <option value="2">2/5</option>
                            <option value="1">1/5</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label for="mediaCommentary" class="form-label">
                            Commentary
                        </label>
                        <textarea class="form-control" id="mediaCommentary" rows="3"></textarea>
                    </div>

                    <button type="submit" class="btn btn-primary">
                        Add to List
                    </button>

                </form>
            </div>

        </div>
    </div>
</div>
